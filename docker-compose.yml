services:
  db:
    image: postgres:16-alpine
    container_name: raizes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raizes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raizes123}
      POSTGRES_DB: ${POSTGRES_DB:-raizes_nordeste}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raizes} -d ${POSTGRES_DB:-raizes_nordeste}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
